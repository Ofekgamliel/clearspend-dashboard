name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=src:. python -m unittest discover -s tests/synthetic -v
      - run: node --test tests/frontend/*.test.js
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e:ci

  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: clearspend-ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEARSPEND_TEST_POSTGRES_HOST: 127.0.0.1
      CLEARSPEND_TEST_POSTGRES_PORT: 5432
      CLEARSPEND_TEST_POSTGRES_DATABASE: postgres
      CLEARSPEND_TEST_POSTGRES_ADMIN_PASSWORD: clearspend-ci-admin-password
      CLEARSPEND_TEST_POSTGRES_RUNTIME_PASSWORD: clearspend-ci-runtime-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          PYTHONPATH=src:.
          python -m unittest discover
          -s tests/integration/postgresql -v
